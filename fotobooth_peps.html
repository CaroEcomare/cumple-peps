<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Fotobooth · El Peps cumple 60</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Righteous&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;background:#1a0a2e;font-family:'Righteous',sans-serif;}
body{display:flex;flex-direction:column;align-items:center;min-height:100vh;}
.hdr{width:100%;background:#c8380a;padding:10px 16px 8px;text-align:center;}
.hdr-t{font-family:'Pacifico',cursive;color:#f5c842;font-size:20px;text-shadow:2px 2px 0 #8b1500;}
.hdr-s{font-size:10px;color:#f0e8d8;letter-spacing:3px;text-transform:uppercase;}
.strip{width:100%;height:7px;display:flex;}
.s1{background:#c8380a;flex:1}.s2{background:#e8a020;flex:1}.s3{background:#4a8fa0;flex:1}.s4{background:#d4960a;flex:1}.s5{background:#6b3a1f;flex:1}
.tabs{display:flex;gap:5px;padding:8px 10px;flex-wrap:wrap;justify-content:center;width:100%;}
.tab{background:#2d1a4a;border:2px solid #4a8fa0;border-radius:20px;padding:5px 14px;color:#f5c842;font-size:11px;cursor:pointer;font-family:'Righteous',sans-serif;letter-spacing:1px;transition:all .2s;}
.tab.on{background:#c8380a;border-color:#f5c842;color:#fff;}
.cam{position:relative;width:100%;max-width:480px;aspect-ratio:3/4;background:#111;overflow:hidden;}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);}
.ov{position:absolute;inset:0;pointer-events:none;z-index:10;width:100%;height:100%;}
.prev{position:absolute;inset:0;z-index:20;display:none;}
.prev img{width:100%;height:100%;object-fit:cover;}
.cdw{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Pacifico',cursive;font-size:88px;color:#f5c842;text-shadow:3px 3px 0 #c8380a;z-index:30;display:none;pointer-events:none;}
.fl{position:absolute;inset:0;background:#fff;opacity:0;z-index:25;pointer-events:none;transition:opacity .05s;}
canvas{display:none;}
.btns{display:flex;gap:8px;padding:10px 12px;justify-content:center;align-items:center;width:100%;}
.shoot{width:62px;height:62px;border-radius:50%;background:#c8380a;border:4px solid #f5c842;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.shoot:active{transform:scale(.93);}
.btn{background:#2d1a4a;border:2px solid #4a8fa0;border-radius:10px;padding:8px 14px;color:#f5c842;font-size:12px;cursor:pointer;font-family:'Righteous',sans-serif;}
.btn.hide{display:none;}
.btn.gr{background:#2d6b2a;border-color:#5dba58;color:#fff;}
.flip{background:#2d1a4a;border:2px solid #4a8fa0;border-radius:50%;width:38px;height:38px;color:#f5c842;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.hint{font-size:11px;color:#b8a0e0;letter-spacing:2px;text-align:center;padding:3px 0 6px;}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-t">Fotobooth del Peps 📸</div>
  <div class="hdr-s">¡El Peps cumple 60!</div>
</div>
<div class="strip"><div class="s1"></div><div class="s2"></div><div class="s3"></div><div class="s4"></div><div class="s5"></div></div>

<div class="tabs">
  <button class="tab on" onclick="sf('flores',this)">🌸 Flores</button>
  <button class="tab" onclick="sf('vinilos',this)">🎵 Vinilos</button>
  <button class="tab" onclick="sf('ondas',this)">〰️ Ondas</button>
  <button class="tab" onclick="sf('disco',this)">🪩 Disco</button>
  <button class="tab" onclick="sf('collage',this)">🎶 Collage</button>
</div>

<div class="cam" id="cam">
  <video id="vid" autoplay playsinline muted></video>
  <svg class="ov" id="svg" viewBox="0 0 360 480" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="ballGrad" cx="33%" cy="28%">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="35%" stop-color="#bbbbbb"/>
        <stop offset="100%" stop-color="#2a2a2a"/>
      </radialGradient>
      <!-- Máscara para dejar zona central libre -->
      <mask id="centerClear">
        <rect width="360" height="480" fill="white"/>
        <!-- Zona libre: desde y=72 hasta y=408, x=0 a x=360 -->
        <rect x="50" y="80" width="260" height="310" fill="black"/>
      </mask>
    </defs>
    <g id="frameContent"></g>
  </svg>
  <div class="cdw" id="cdw"></div>
  <div class="fl" id="fl"></div>
  <div class="prev" id="prev"><img id="pimg" src="" alt="foto"/></div>
</div>
<canvas id="cv"></canvas>

<div class="hint" id="hint">Elige un marco y toca 📸</div>
<div class="btns">
  <button class="flip" onclick="fc()">🔄</button>
  <button class="btn hide" id="rb" onclick="retake()">↩ Repetir</button>
  <button class="shoot" onclick="go()">📸</button>
  <button class="btn hide gr" id="sb" onclick="savePh()">⬇ Guardar</button>
</div>
<div class="strip"><div class="s5"></div><div class="s4"></div><div class="s3"></div><div class="s2"></div><div class="s1"></div></div>

<script>
const vid=document.getElementById('vid');
const frameContent=document.getElementById('frameContent');
const cdw=document.getElementById('cdw');
const fl=document.getElementById('fl');
const prev=document.getElementById('prev');
const pimg=document.getElementById('pimg');
const cv=document.getElementById('cv');
const rb=document.getElementById('rb');
const sb=document.getElementById('sb');
const hint=document.getElementById('hint');
let fm='user', taken=false, stream=null;

async function startCam(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:fm},audio:false});
    vid.srcObject=stream;
  } catch(e){
    hint.textContent='Permite el acceso a la cámara ☝️';
    hint.style.color='#e8a020';
  }
}
async function fc(){ fm=fm==='user'?'environment':'user'; await startCam(); }
startCam();

// ── HELPERS ──────────────────────────────────────────────────
// La zona central libre es: x=50..310, y=80..390 (260x310px en viewBox 360x480)
// TODOS los marcos solo ponen elementos FUERA de esa zona

function D(cx,cy,r,c1,c2,c3){
  let o='';
  for(let i=0;i<8;i++){
    const a=(i/8)*Math.PI*2;
    const px=cx+Math.cos(a)*r*.58, py=cy+Math.sin(a)*r*.58;
    o+=`<ellipse cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" rx="${(r*.28).toFixed(1)}" ry="${(r*.44).toFixed(1)}" transform="rotate(${((a*180/Math.PI)+90).toFixed(1)} ${px.toFixed(1)} ${py.toFixed(1)})" fill="${c1}"/>`;
  }
  return o+`<circle cx="${cx}" cy="${cy}" r="${(r*.32).toFixed(1)}" fill="${c2}"/>
  <circle cx="${cx}" cy="${cy}" r="${(r*.13).toFixed(1)}" fill="${c3}"/>`;
}
function V(cx,cy,r,lc){
  return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#111"/>
  <circle cx="${cx}" cy="${cy}" r="${(r*.78).toFixed(1)}" fill="none" stroke="#1a1a1a" stroke-width="${(r*.14).toFixed(1)}"/>
  <circle cx="${cx}" cy="${cy}" r="${(r*.56).toFixed(1)}" fill="none" stroke="#131313" stroke-width="${(r*.11).toFixed(1)}"/>
  <circle cx="${cx}" cy="${cy}" r="${(r*.37).toFixed(1)}" fill="${lc}"/>
  <circle cx="${cx}" cy="${cy}" r="${(r*.08).toFixed(1)}" fill="#111"/>`;
}
function C(x,y,w,h,col){
  return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${(h*.15).toFixed(1)}" fill="${col}"/>
  <rect x="${(x+w*.08).toFixed(1)}" y="${(y+h*.1).toFixed(1)}" width="${(w*.84).toFixed(1)}" height="${(h*.5).toFixed(1)}" rx="${(h*.1).toFixed(1)}" fill="rgba(0,0,0,.28)"/>
  <circle cx="${(x+w*.3).toFixed(1)}" cy="${(y+h*.37).toFixed(1)}" r="${(h*.15).toFixed(1)}" fill="#1a1a1a"/>
  <circle cx="${(x+w*.7).toFixed(1)}" cy="${(y+h*.37).toFixed(1)}" r="${(h*.15).toFixed(1)}" fill="#1a1a1a"/>
  <circle cx="${(x+w*.3).toFixed(1)}" cy="${(y+h*.37).toFixed(1)}" r="${(h*.06).toFixed(1)}" fill="${col}" opacity=".55"/>
  <circle cx="${(x+w*.7).toFixed(1)}" cy="${(y+h*.37).toFixed(1)}" r="${(h*.06).toFixed(1)}" fill="${col}" opacity=".55"/>`;
}
function N(x,y,s,col){ return `<text x="${x}" y="${y}" font-size="${s}" fill="${col}" font-family="serif">♪</text>`; }

// Badges: título arriba (y=8..42), info abajo (y=442..468)

function sf(name,btn){
  frameContent.innerHTML = frames[name]();
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));
  if(btn) btn.classList.add('on');
}
sf('flores', document.querySelector('.tab.on'));

function go(){
  if(taken) return;
  let c=3;
  cdw.style.display='block'; cdw.textContent=c;
  const iv=setInterval(()=>{
    c--;
    if(c>0){ cdw.textContent=c; }
    else{ clearInterval(iv); cdw.textContent='📸'; setTimeout(()=>{ cdw.style.display='none'; snap(); },300); }
  },1000);
}

function snap(){
  const wrap=document.getElementById('cam');
  const w=wrap.offsetWidth, h=wrap.offsetHeight;
  cv.width=w; cv.height=h;
  const ctx=cv.getContext('2d');
  ctx.save();
  if(fm==='user'){ ctx.translate(w,0); ctx.scale(-1,1); }
  ctx.drawImage(vid,0,0,w,h);
  ctx.restore();
  const fullSvg=document.getElementById('svg');
  const sd=new XMLSerializer().serializeToString(fullSvg);
  const blob=new Blob([sd],{type:'image/svg+xml;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const img=new Image();
  img.onload=()=>{
    ctx.drawImage(img,0,0,w,h);
    URL.revokeObjectURL(url);
    pimg.src=cv.toDataURL('image/jpeg',.92);
    prev.style.display='block'; taken=true;
    rb.classList.remove('hide'); sb.classList.remove('hide');
    hint.textContent='¡Órale! Guarda o repite 📸';
    fl.style.opacity='1'; setTimeout(()=>{ fl.style.opacity='0'; },120);
  };
  img.src=url;
}

function retake(){
  prev.style.display='none'; taken=false;
  rb.classList.add('hide'); sb.classList.add('hide');
  hint.textContent='Elige un marco y toca 📸';
}
function savePh(){
  const a=document.createElement('a');
  a.download='peps60.jpg';
  a.href=cv.toDataURL('image/jpeg',.92);
  a.click();
}
