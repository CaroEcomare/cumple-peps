<style>
@import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Righteous&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;background:#1a0a2e;font-family:'Righteous',sans-serif;}
body{display:flex;flex-direction:column;align-items:center;min-height:100vh;}
.hdr{width:100%;background:#c8380a;padding:10px 16px 8px;text-align:center;}
.hdr-t{font-family:'Pacifico',cursive;color:#f5c842;font-size:20px;text-shadow:2px 2px 0 #8b1500;}
.hdr-s{font-size:10px;color:#f0e8d8;letter-spacing:3px;text-transform:uppercase;}
.strip{width:100%;height:7px;display:flex;}
.s1{background:#c8380a;flex:1}.s2{background:#e8a020;flex:1}.s3{background:#4a8fa0;flex:1}.s4{background:#d4960a;flex:1}.s5{background:#6b3a1f;flex:1}
.cam{position:relative;width:100%;max-width:480px;aspect-ratio:2/3;background:#111;overflow:hidden;}
video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);}
.frame-img{position:absolute;inset:0;width:100%;height:100%;z-index:10;pointer-events:none;object-fit:fill;}
.prev{position:absolute;inset:0;z-index:20;display:none;}
.prev img{width:100%;height:100%;object-fit:cover;}
.cdw{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Pacifico',cursive;font-size:88px;color:#f5c842;text-shadow:3px 3px 0 #c8380a;z-index:30;display:none;pointer-events:none;}
.fl{position:absolute;inset:0;background:#fff;opacity:0;z-index:25;pointer-events:none;transition:opacity .05s;}
canvas{display:none;}
.btns{display:flex;gap:8px;padding:10px 12px;justify-content:center;align-items:center;width:100%;}
.shoot{width:62px;height:62px;border-radius:50%;background:#c8380a;border:4px solid #f5c842;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.shoot:active{transform:scale(.93);}
.btn{background:#2d1a4a;border:2px solid #4a8fa0;border-radius:10px;padding:8px 14px;color:#f5c842;font-size:12px;cursor:pointer;font-family:'Righteous',sans-serif;}
.btn.hide{display:none;}
.btn.gr{background:#2d6b2a;border-color:#5dba58;color:#fff;}
.flip{background:#2d1a4a;border:2px solid #4a8fa0;border-radius:50%;width:38px;height:38px;color:#f5c842;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.hint{font-size:11px;color:#b8a0e0;letter-spacing:2px;text-align:center;padding:3px 0 6px;}
</style>
</head>

  <div class="cdw" id="cdw"></div>
  <div class="fl" id="fl"></div>
  <div class="prev" id="prev"><img id="pimg" src="" alt="foto"/></div>
</div>
<canvas id="cv"></canvas>

<div class="hint" id="hint">Toca 📸 cuando estés listo</div>
<div class="btns">
  <button class="flip" onclick="fc()">🔄</button>
  <button class="btn hide" id="rb" onclick="retake()">↩ Repetir</button>
  <button class="shoot" onclick="go()">📸</button>
  <button class="btn hide gr" id="sb" onclick="savePh()">⬇ Guardar</button>
</div>
<div class="strip"><div class="s5"></div><div class="s4"></div><div class="s3"></div><div class="s2"></div><div class="s1"></div></div>

<script>
const vid=document.getElementById('vid');
const frameImg=document.getElementById('frameImg');
const cdw=document.getElementById('cdw');
const fl=document.getElementById('fl');
const prev=document.getElementById('prev');
const pimg=document.getElementById('pimg');
const cv=document.getElementById('cv');
const rb=document.getElementById('rb');
const sb=document.getElementById('sb');
const hint=document.getElementById('hint');
let fm='user', taken=false, stream=null;

async function startCam(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:fm},audio:false});
    vid.srcObject=stream;
  } catch(e){
    hint.textContent='Permite el acceso a la cámara ☝️';
    hint.style.color='#e8a020';
  }
}
async function fc(){ fm=fm==='user'?'environment':'user'; await startCam(); }
startCam();

function go(){
  if(taken) return;
  let c=3;
  cdw.style.display='block'; cdw.textContent=c;
  const iv=setInterval(()=>{
    c--;
    if(c>0){ cdw.textContent=c; }
    else{ clearInterval(iv); cdw.textContent='📸'; setTimeout(()=>{ cdw.style.display='none'; snap(); },300); }
  },1000);
}

function snap(){
  const wrap=document.getElementById('cam');
  const w=wrap.offsetWidth, h=wrap.offsetHeight;
  cv.width=w; cv.height=h;
  const ctx=cv.getContext('2d');
  // Dibujar video (con espejo si es frontal)
  ctx.save();
  if(fm==='user'){ ctx.translate(w,0); ctx.scale(-1,1); }
  ctx.drawImage(vid,0,0,w,h);
  ctx.restore();
  // Dibujar el marco PNG encima
  ctx.drawImage(frameImg,0,0,w,h);
  // Mostrar preview
  pimg.src=cv.toDataURL('image/jpeg',.92);
  prev.style.display='block';
  taken=true;
  rb.classList.remove('hide'); sb.classList.remove('hide');
  hint.textContent='¡Órale! Guarda o repite 📸';
  fl.style.opacity='1'; setTimeout(()=>{ fl.style.opacity='0'; },120);
}

function retake(){
  prev.style.display='none'; taken=false;
  rb.classList.add('hide'); sb.classList.add('hide');
  hint.textContent='Toca 📸 cuando estés listo';
}
function savePh(){
  const a=document.createElement('a');
  a.download='peps60.jpg';
  a.href=cv.toDataURL('image/jpeg',.92);
  a.click();
}
</script>
