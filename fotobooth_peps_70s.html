
<!DOCTYPE html>
<style>
@import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Righteous&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #1a0a2e;
  font-family: 'Righteous', sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  overflow-x: hidden;
}

.app-header {
  background: #c8380a;
  width: 100%;
  padding: 12px 20px 8px;
  text-align: center;
  position: relative;
}

.app-title {
  font-family: 'Pacifico', cursive;
  color: #f5c842;
  font-size: 22px;
  text-shadow: 2px 2px 0 #8b1500;
}

.app-sub {
  font-size: 10px;
  color: #f0e8d8;
  letter-spacing: 3px;
  text-transform: uppercase;
}

.strip-bar {
  width: 100%;
  height: 10px;
  display: flex;
}
.s1{background:#c8380a;flex:1}
.s2{background:#e8a020;flex:1}
.s3{background:#4a8fa0;flex:1}
.s4{background:#d4960a;flex:1}
.s5{background:#2d1a4a;flex:1}

/* Frame selector */
.frame-selector {
  display: flex;
  gap: 8px;
  padding: 12px 16px;
  overflow-x: auto;
  width: 100%;
  justify-content: center;
}

.frame-btn {
  background: #2d1a4a;
  border: 2px solid #4a8fa0;
  border-radius: 10px;
  padding: 6px 14px;
  color: #f5c842;
  font-family: 'Righteous', sans-serif;
  font-size: 11px;
  letter-spacing: 1px;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
  flex-shrink: 0;
}

.frame-btn.active, .frame-btn:hover {
  background: #c8380a;
  border-color: #f5c842;
  color: #fff;
}

/* Camera area */
.camera-wrap {
  position: relative;
  width: 100%;
  max-width: 480px;
  aspect-ratio: 3/4;
  background: #000;
  overflow: hidden;
}

video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

canvas#photoCanvas {
  display: none;
}

/* The frame overlay */
.frame-overlay {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 10;
}

/* Preview overlay when photo taken */
.photo-preview {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: none;
}

.photo-preview img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Controls */
.controls {
  display: flex;
  gap: 12px;
  padding: 14px 16px;
  justify-content: center;
  align-items: center;
  width: 100%;
  max-width: 480px;
}

.shutter-btn {
  width: 68px;
  height: 68px;
  border-radius: 50%;
  background: #c8380a;
  border: 4px solid #f5c842;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
  transition: transform 0.1s;
  box-shadow: 0 0 0 4px rgba(245,200,66,0.2);
}

.shutter-btn:hover { transform: scale(1.05); }
.shutter-btn:active { transform: scale(0.95); }

.action-btn {
  background: #2d1a4a;
  border: 2px solid #4a8fa0;
  border-radius: 12px;
  padding: 10px 18px;
  color: #f5c842;
  font-family: 'Righteous', sans-serif;
  font-size: 12px;
  letter-spacing: 1px;
  cursor: pointer;
  transition: all 0.2s;
}

.action-btn:hover { background: #4a8fa0; color: #fff; }
.action-btn.hidden { display: none; }
.action-btn.green { background: #2d6b2a; border-color: #5dba58; }
.action-btn.green:hover { background: #5dba58; }

.countdown {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-family: 'Pacifico', cursive;
  font-size: 100px;
  color: #f5c842;
  text-shadow: 4px 4px 0 #c8380a;
  z-index: 30;
  display: none;
  pointer-events: none;
}

/* Flash effect */
.flash {
  position: absolute;
  inset: 0;
  background: white;
  z-index: 25;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.05s;
}

.hint {
  font-size: 11px;
  color: #b8a0e0;
  letter-spacing: 2px;
  text-align: center;
  padding: 4px 0 8px;
}

</style>

<div class="app-header">
  <div class="app-title">Fotobooth del Peps 📸</div>
  <div class="app-sub">Cumpleaños 60 · Años 70s</div>
</div>
<div class="strip-bar"><div class="s1"></div><div class="s2"></div><div class="s3"></div><div class="s4"></div><div class="s5"></div></div>

<!-- Frame selector -->
<div class="frame-selector">
  <button class="frame-btn active" onclick="setFrame('flores')" id="btn-flores">🌸 Flores</button>
  <button class="frame-btn" onclick="setFrame('disco')" id="btn-disco">🪩 Disco</button>
  <button class="frame-btn" onclick="setFrame('groovy')" id="btn-groovy">✌ Groovy</button>
  <button class="frame-btn" onclick="setFrame('combi')" id="btn-combi">🚌 Combi</button>
</div>

<!-- Camera -->
<div class="camera-wrap" id="cameraWrap">
  <video id="video" autoplay playsinline muted></video>

  <!-- Frame SVG overlay -->
  <svg class="frame-overlay" id="frameSvg" viewBox="0 0 360 480" xmlns="http://www.w3.org/2000/svg">
    <!-- Loaded dynamically -->
  </svg>

  <!-- Countdown -->
  <div class="countdown" id="countdown"></div>

  <!-- Flash -->
  <div class="flash" id="flash"></div>

  <!-- Photo preview -->
  <div class="photo-preview" id="photoPreview">
    <img id="photoImg" src="" alt="foto"/>
  </div>
</div>

<canvas id="photoCanvas"></canvas>

<div class="hint" id="hint">Elige un marco y toca 📸</div>

<!-- Controls -->
<div class="controls">
  <button class="action-btn hidden" id="retakeBtn" onclick="retake()">↩ Repetir</button>
  <button class="shutter-btn" id="shutterBtn" onclick="startCountdown()">📸</button>
  <button class="action-btn hidden green" id="saveBtn" onclick="savePhoto()">⬇ Guardar</button>

<div class="strip-bar"><div class="s1"></div><div class="s2"></div><div class="s3"></div><div class="s4"></div><div class="s5"></div></div>

      audio: false
    });
    video.srcObject = stream;

    hint.textContent = 'Permite el acceso a la cámara para usar el fotobooth';

function setFrame(name) {
  currentFrame = name;
  frameSvg.innerHTML = frames[name];
  document.querySelectorAll('.frame-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + name).classList.add('active');
}

setFrame('flores');

function startCountdown() {
  if (photoTaken) return;
  shutterBtn.disabled = true;
  let count = 3;
  countdown.style.display = 'block';
  countdown.textContent = count;

  const interval = setInterval(() => {
    count--;
    if (count > 0) {
      countdown.textContent = count;
    } else {
      clearInterval(interval);
      countdown.style.display = 'none';
      takePhoto();
      shutterBtn.disabled = false;
    }
  }, 1000);
}

function takePhoto() {
  const wrap = document.getElementById('cameraWrap');
  const w = wrap.offsetWidth;
  const h = wrap.offsetHeight;

  photoCanvas.width = w;
  photoCanvas.height = h;
  const ctx = photoCanvas.getContext('2d');

  // Draw video
  ctx.drawImage(video, 0, 0, w, h);

  // Draw SVG frame overlay
  const svgData = new XMLSerializer().serializeToString(frameSvg);
  const svgBlob = new Blob([svgData], {type: 'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(svgBlob);
  const img = new Image();
  img.onload = () => {
    ctx.drawImage(img, 0, 0, w, h);
    URL.revokeObjectURL(url);
    const dataUrl = photoCanvas.toDataURL('image/jpeg', 0.92);
    photoImg.src = dataUrl;
    photoPreview.style.display = 'block';
    photoTaken = true;
    retakeBtn.classList.remove('hidden');
    saveBtn.classList.remove('hidden');
    hint.textContent = '¡Órale! Guarda o repite 📸';

    // Flash effect
    flash.style.opacity = '1';
    setTimeout(() => { flash.style.opacity = '0'; }, 150);
  };
  img.src = url;
}

function retake() {
  photoPreview.style.display = 'none';
  photoTaken = false;
  retakeBtn.classList.add('hidden');
  saveBtn.classList.add('hidden');
  hint.textContent = 'Elige un marco y toca 📸';
}

function savePhoto() {
  const link = document.createElement('a');
  link.download = 'cumple-peps-60.jpg';
  link.href = photoCanvas.toDataURL('image/jpeg', 0.92);
  link.click();
}
</script>
